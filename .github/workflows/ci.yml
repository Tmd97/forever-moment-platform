# This is the entrypoint workflow for the platform repository.
# It only handles triggers and delegates actual CI work to the reusable workflow.
name: Platform CI

on:
  # Run CI when code is pushed to main or when PR targets main.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  # Cancel older runs for the same branch so only newest commit keeps running.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-shared-ci:
    # Call local reusable workflow maintained in the platform repository.
    uses: ./.github/workflows/reusable-ci.yml
    with:
      service_name: platform
      # Full Docker Hub image repository for platform service.
      dockerhub_repository: groote123/moment-forever-platform
      java_version: "17"
      maven_verify_args: "-B -ntp clean verify"
      dockerfile_path: "Dockerfile"
      push_latest_on_main: true
    secrets:
      # Read Docker credentials from repository secrets.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
